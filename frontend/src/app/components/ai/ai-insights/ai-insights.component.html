<div class="container-main">
  <div class="insights-header">
    <div class="insights-header-title">
      <i class="bi bi-bar-chart-line"></i>
      <div>
        <h1>AI Librarian Insights</h1>
        <p class="lead">Ask data-driven questions about your library catalog — backed by real borrow statistics.</p>
      </div>
    </div>
    <button class="btn-outline-danger" *ngIf="isAdmin" (click)="reindex()" title="Re-embed all books into the vector store">
      <i class="bi bi-arrow-repeat"></i> Re-index Books
    </button>
  </div>

  <!-- Preset insight cards -->
  <div class="preset-grid">
    <div
      *ngFor="let card of presetInsights"
      class="preset-card"
      [class.active]="activeQuestion === card.question"
      (click)="runPreset(card)"
      role="button"
      tabindex="0"
      (keydown.enter)="runPreset(card)">
      <i class="bi {{ card.icon }} preset-icon"></i>
      <span>{{ card.label }}</span>
      <i class="bi bi-arrow-right preset-arrow"></i>
    </div>
  </div>

  <!-- Custom question input -->
  <div class="custom-section">
    <label class="custom-label">Custom question</label>
    <div class="custom-input-row">
      <input
        type="text"
        class="form-control"
        [(ngModel)]="customQuestion"
        placeholder="e.g. Which categories are most popular this month?"
        (keydown.enter)="runCustom()"
        [disabled]="isLoading" />
      <button
        class="btn btn-primary"
        (click)="runCustom()"
        [disabled]="isLoading || !customQuestion.trim()">
        <i class="bi bi-send"></i> Ask
      </button>
    </div>
  </div>

  <!-- Loading state -->
  <div class="loading-panel" *ngIf="isLoading">
    <div class="loading-dots">
      <span></span><span></span><span></span>
    </div>
    <p>Analyzing library data...</p>
  </div>

  <!-- Error -->
  <div class="alert alert-danger mt-3" *ngIf="error && !isLoading">{{ error }}</div>

  <!-- Result panel -->
  <div class="result-panel" *ngIf="result && !isLoading">
    <div class="result-meta">
      <span class="result-question"><i class="bi bi-question-circle"></i> {{ activeQuestion }}</span>
      <span class="result-time">Generated {{ result.generatedAt | date:'medium' }}</span>
    </div>
    <div class="result-body" style="white-space: pre-wrap;">{{ result.analysis }}</div>
  </div>
</div>
