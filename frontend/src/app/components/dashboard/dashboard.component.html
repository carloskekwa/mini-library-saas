<div class="container-main">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h1>Member Dashboard</h1>
      <p class="lead">Your personal overview for borrowing and reservations.</p>
    </div>
    <span class="badge text-bg-secondary fs-6">MEMBER</span>
  </div>

  <div class="row">
    <div class="col-md-3 mb-4">
      <div class="card stat-card">
        <div class="card-body text-center">
          <h6 class="card-title">Books Borrowed</h6>
          <h2 class="text-primary">5</h2>
        </div>
      </div>
    </div>
    <div class="col-md-3 mb-4">
      <div class="card stat-card">
        <div class="card-body text-center">
          <h6 class="card-title">Books Reserved</h6>
          <h2 class="text-info">2</h2>
        </div>
      </div>
    </div>
    <div class="col-md-3 mb-4">
      <div class="card stat-card">
        <div class="card-body text-center">
          <h6 class="card-title">Pending Fines</h6>
          <h2 class="text-danger">$12.50</h2>
        </div>
      </div>
    </div>
    <div class="col-md-3 mb-4">
      <div class="card stat-card">
        <div class="card-body text-center">
          <h6 class="card-title">Notifications</h6>
          <h2 class="text-warning">3</h2>
        </div>
      </div>
    </div>
  </div>

  <div class="row mt-4">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header">
          <h5 class="mb-0">Quick Actions</h5>
        </div>
        <div class="card-body">
          <div class="d-grid gap-2">
            <a class="btn btn-outline-primary" routerLink="/books">Browse Books</a>
            <a class="btn btn-outline-primary" routerLink="/borrows">View My Borrows</a>
            <a class="btn btn-outline-primary" routerLink="/reservations">Check Reservations</a>
          </div>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="card">
        <div class="card-header">
          <h5 class="mb-0">Recent Activity</h5>
        </div>
        <div class="card-body">
          <p class="text-muted">No recent activity</p>
        </div>
      </div>
    </div>
  </div>
</div>
