# Production override — used on EC2 with OpenAI instead of Ollama.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Required env vars in .env:
#   OPENAI_API_KEY=sk-...
#   MYSQL_ROOT_PASSWORD, MYSQL_USER, MYSQL_PASSWORD, DB_NAME, DB_USER, DB_PASSWORD
#   JWT_SECRET (min 64 chars)

services:
  app:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      LOGGING_LEVEL_ROOT: WARN
      LOGGING_LEVEL_COM_LIBRARY: INFO
    # No Ollama dependency in prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_healthy
      chromadb:
        condition: service_healthy
