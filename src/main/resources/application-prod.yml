spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  # Disable Ollama in production; OpenAI is used instead
  autoconfigure:
    exclude: org.springframework.ai.autoconfigure.ollama.OllamaAutoConfiguration

  # Spring AI — OpenAI (production)
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
          temperature: 0.3
          max-tokens: 1024
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    vectorstore:
      chroma:
        client:
          host: ${CHROMA_HOST:http://chromadb}
          port: ${CHROMA_PORT:8000}
        collection-name: library-books
        initialize-schema: true

server:
  servlet:
    context-path: /
  compression:
    enabled: true
    min-response-size: 1024

logging:
  level:
    root: WARN
    com.library: INFO
  file:
    name: /var/log/library/application.log
    max-size: 10MB
    max-history: 30
